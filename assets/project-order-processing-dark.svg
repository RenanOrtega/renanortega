<svg xmlns="http://www.w3.org/2000/svg" width="840" height="214" viewBox="0 0 840 214" role="img" aria-label="Order Processing Platform">

  <defs>
    <linearGradient id="gc1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dotsc1" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2A3345"/>
    </pattern>
  </defs>
  <rect x=".5" y=".5" width="839" height="213" rx="16" fill="#0F141F" stroke="#1E2635"/>
  <rect x="0" y="28" width="3" height="44" rx="1.5" fill="url(#gc1)"/>
  <text x="36" y="66" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="url(#gc1)">01</text>
  <text x="118" y="64" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="23" font-weight="750" letter-spacing="-.4" fill="#E8EBF2">Order Processing Platform</text>
  <text x="808" y="62" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#8892A6">event-driven backend</text>
  <text x="118" y="98" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14.5" fill="#8892A6">Asynchronous order processing using the Transactional Outbox pattern:</text><text x="118" y="119" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14.5" fill="#8892A6">orders and events saved atomically, then fanned out to Lambdas via SQS.</text>
  <text x="118" y="150" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" fill="#E8EBF2"><tspan>API</tspan><tspan fill="url(#gc1)" font-weight="700">  →  </tspan><tspan>Outbox</tspan><tspan fill="url(#gc1)" font-weight="700">  →  </tspan><tspan>Worker</tspan><tspan fill="url(#gc1)" font-weight="700">  →  </tspan><tspan>SQS</tspan><tspan fill="url(#gc1)" font-weight="700">  →  </tspan><tspan>Lambda</tspan></text>
  <rect x="118" y="166" width="72" height="26" rx="13" fill="#151B29" stroke="#1E2635"/><text x="154.0" y="183.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11.5" fill="#C9CFDC">.NET 10</text><rect x="197.91" y="166" width="51" height="26" rx="13" fill="#151B29" stroke="#1E2635"/><text x="223.2" y="183.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11.5" fill="#C9CFDC">CQRS</text><rect x="256.43" y="166" width="93" height="26" rx="13" fill="#151B29" stroke="#1E2635"/><text x="303.1" y="183.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11.5" fill="#C9CFDC">PostgreSQL</text><rect x="357.73" y="166" width="72" height="26" rx="13" fill="#151B29" stroke="#1E2635"/><text x="393.7" y="183.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11.5" fill="#C9CFDC">EF Core</text><rect x="437.64" y="166" width="72" height="26" rx="13" fill="#151B29" stroke="#1E2635"/><text x="473.6" y="183.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11.5" fill="#C9CFDC">AWS SQS</text><rect x="517.55" y="166" width="93" height="26" rx="13" fill="#151B29" stroke="#1E2635"/><text x="564.2" y="183.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11.5" fill="#C9CFDC">AWS Lambda</text>
